<div class="grid min-h-screen grid-cols-[254px_minmax(0,1fr)] max-md:grid-cols-1">
  <aside
    class="flex flex-col gap-6 border-r border-surface-200 bg-surface-0 px-4 py-6 dark:border-surface-700 dark:bg-surface-900 max-md:hidden"
  >
    <a
      class="flex items-center gap-2.5 font-bold text-surface-950 no-underline dark:text-surface-0"
      routerLink="/home"
    >
      <i class="pi pi-th-large text-primary"></i><span>Microfront Launcher</span>
    </a>
    <nav class="grid gap-1" aria-label="Navegación principal">
      <a class="nav-link" routerLink="/home" routerLinkActive="nav-link-active"
        ><i class="pi pi-home"></i>Inicio</a
      >
      <a class="nav-link" routerLink="/shells" routerLinkActive="nav-link-active"
        ><i class="pi pi-desktop"></i>Shells</a
      >
      <a class="nav-link" routerLink="/microfronts" routerLinkActive="nav-link-active"
        ><i class="pi pi-box"></i>Microfrontends</a
      >
      <a class="nav-link" routerLink="/tags" routerLinkActive="nav-link-active"
        ><i class="pi pi-tags"></i>Versiones</a
      >
    </nav>
    <a class="nav-link mt-auto" routerLink="/setup"><i class="pi pi-cog"></i>Configuración</a>
  </aside>

  <main class="min-w-0">
    <header
      class="flex items-center justify-between gap-4 border-b border-surface-200 bg-surface-0 px-7 py-4 text-sm text-surface-500 dark:border-surface-700 dark:bg-surface-900 dark:text-surface-400 max-md:px-4 max-md:py-3"
    >
      <span>Angular 21 · PrimeNG 21</span>
      <div class="flex items-center gap-2">
        <button
          pButton
          type="button"
          [icon]="theme.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
          [label]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'"
          [attr.aria-pressed]="theme.isDark()"
          class="p-button-sm p-button-outlined"
          (click)="theme.toggle()"
        ></button>
        <button
          pButton
          type="button"
          label="Abrir navegador"
          icon="pi pi-external-link"
          class="p-button-sm p-button-outlined"
        ></button>
        <button
          pButton
          type="button"
          label="Visualizar consola"
          icon="pi pi-terminal"
          class="p-button-sm p-button-outlined"
          (click)="consoleVisible.set(true)"
        ></button>
      </div>
    </header>
    <section class="p-7 max-md:p-4"><router-outlet></router-outlet></section>
  </main>
</div>

<p-dialog
  header="Consola de proceso"
  [modal]="true"
  [visible]="consoleVisible()"
  [style]="{ width: 'min(980px, calc(100vw - 2rem))' }"
  [draggable]="false"
  (visibleChange)="consoleVisible.set($event)"
>
  <app-process-console [logs]="bootstrap.logs.value()" />
</p-dialog>
