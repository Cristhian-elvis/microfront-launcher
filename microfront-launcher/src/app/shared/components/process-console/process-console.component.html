<section class="console-panel">
  <header>
    <div>
      <svg
        class="console-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="4 17 10 11 4 5" />
        <line x1="12" y1="19" x2="20" y2="19" /></svg
      ><strong>Consola de proceso</strong><span>{{ visibleLogs().length }} eventos</span>
    </div>
    <p-button
      label="Limpiar vista"
      icon="pi pi-trash"
      styleClass="p-button-sm p-button-text"
      (onClick)="clearView()"
    />
  </header>
  <div class="console-body">
    @for (log of visibleLogs().slice(-250); track log.id) {
      <div class="log-line" [class.error]="log.level === 'error'">
        <time>{{ log.at | date: 'HH:mm:ss' }}</time>
        <b>{{ log.source }}</b>
        <span>{{ log.message }}</span>
      </div>
    }
    @if (!visibleLogs().length) {
      <p class="empty">Aquí se mostrarán las acciones y resultados del entorno.</p>
    }
  </div>
</section>
