<section *ngIf="!loading && microfront; else load" class="microfront-detail"><header><p-button icon="pi pi-arrow-left" styleClass="p-button-text p-button-rounded" (onClick)="back()"></p-button><div><h1>{{ microfront.name }}</h1><p>Detalles y acciones del microfront.</p></div></header><div class="actions"><p-select [options]="[{label:'Compilar',value:'build'},{label:'Sincronizar',value:'refresh'},{label:'Cambiar rama',value:'branch'}]" [(ngModel)]="actionName" placeholder="Seleccionar acción"></p-select><p-select *ngIf="actionName === 'branch'" [options]="microfront.branches || []" [(ngModel)]="branch" placeholder="Rama destino"></p-select><p-button *ngIf="actionName && (actionName !== 'branch' || branch)" label="Aplicar" [disabled]="pending" (onClick)="apply()"></p-button></div><div class="grid"><article><span>Ruta local</span><code>{{ microfront.path }}</code><p-button label="Abrir explorador" icon="pi pi-folder-open" styleClass="p-button-outlined" [disabled]="pending" (onClick)="run('/api/microfrontends/open-folder')"></p-button></article><article><span>Editor</span><strong>VS Code</strong><p-button label="Abrir en VS Code" icon="pi pi-code" styleClass="p-button-outlined" [disabled]="pending" (onClick)="run('/api/microfrontends/open')"></p-button></article><article><span>Rama actual</span><strong>{{ microfront.branch || 'No disponible' }}</strong></article><article><span>Build local</span><strong>{{ microfront.localBuildAvailable ? 'Disponible' : 'No disponible' }}</strong></article></div><p *ngIf="microfront.outOfSync" class="warning">Cambios pendientes por descargar.</p></section><ng-template #load><div class="loading"><p-progressSpinner></p-progressSpinner></div></ng-template>
